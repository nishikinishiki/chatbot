            const container = document.getElementById('pageSpread');

            // Normalize page index
            if (pageIndex < 1) pageIndex = 1;
            if (pageIndex > total) pageIndex = total;

            // In two-page mode, align to odd page index for left side
            if (viewMode === 'two' && pageIndex % 2 === 0 && pageIndex > 1) {
                pageIndex = pageIndex - 1;

            currentPage = pageIndex;

            // Font Class Mapping
            const fontClass = `text-size-${currentFontSize}`;
            const pageBgClass = "bg-white text-slate-800";

            let html = '';

        };

        window.closeZoomModal = function () {
            const modal = document.getElementById('zoomModal');
            const modalCard = document.getElementById('zoomModalCard');
            modal.classList.add('opacity-0');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        };

        document.getElementById('zoomModal').addEventListener('click', (e) => {
            if (e.target.id === 'zoomModal') {
                closeZoomModal();
            }
        });

        // Navigation Functions
        function nextPage() {
            const step = (viewMode === 'two') ? 2 : 1;
            if (currentPage + step <= ebookData.pages.length + (viewMode === 'two' ? 1 : 0)) {
                renderPages(currentPage + step, 'next');
            }
        }

        function prevPage() {
            const step = (viewMode === 'two') ? 2 : 1;
            if (currentPage - step >= 1) {
                renderPages(currentPage - step, 'prev');
            }
        }

        document.getElementById('nextBtn').addEventListener('click', nextPage);
        document.getElementById('prevBtn').addEventListener('click', prevPage);

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextPage();
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevPage();
            if (e.key === 'Escape') closeZoomModal();
        });

        // Slider Event
        document.getElementById('pageSlider').addEventListener('input', (e) => {
            renderPages(parseInt(e.target.value));
        });

        // Settings Panel Toggle
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        settingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('hidden');
        });

        // Close panel when clicking outside
        document.addEventListener('click', (e) => {
            if (!settingsBtn.contains(e.target) && !settingsPanel.contains(e.target)) {
                settingsPanel.classList.add('hidden');
            }
        });

        // Font Size Options
        document.querySelectorAll('.size-opt').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const target = e.currentTarget;
                currentFontSize = target.getAttribute('data-size');
                document.querySelectorAll('.size-opt').forEach(b => {
                    b.className = 'size-opt flex-1 py-1.5 rounded-md text-slate-600 text-xs font-semibold';
                });
                target.className = 'size-opt flex-1 py-1.5 rounded-md bg-white text-slate-900 shadow-sm text-sm font-semibold';
                renderPages(currentPage);
            });
        });

        // View Mode Options
        document.getElementById('viewModeOne').addEventListener('click', () => {
            viewMode = 'one';
            updateResponsiveViewMode();
            renderPages(currentPage);
        });

        document.getElementById('viewModeTwo').addEventListener('click', () => {
            viewMode = 'two';
            updateResponsiveViewMode();
            renderPages(currentPage);
        });

        // Table of Contents Population and Controls
        const tocDrawer = document.getElementById('tocDrawer');
        const tocOverlay = document.getElementById('tocOverlay');
        const tocList = document.getElementById('tocList');

        function populateToc() {
            tocList.innerHTML = ebookData.pages.map(p => `
                <button onclick="jumpToPage(${p.id})" class="w-full text-left p-2.5 rounded-lg hover:bg-slate-100 text-slate-700 hover:text-amber-800 transition flex items-center justify-between border-b border-slate-100">
                    <span class="truncate pr-2 font-medium">${p.id}. ${p.chapterTitle || '表紙'}</span>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                </button>
            `).join('');
        }

        function openToc() {
            tocDrawer.classList.remove('-translate-x-full');
            tocOverlay.classList.remove('hidden');
            setTimeout(() => tocOverlay.classList.remove('opacity-0'), 10);
        }

        function closeToc() {
            tocDrawer.classList.add('-translate-x-full');
            tocOverlay.classList.add('opacity-0');
            setTimeout(() => tocOverlay.classList.add('hidden'), 300);
        }

        document.getElementById('tocBtn').addEventListener('click', openToc);
        document.getElementById('closeTocBtn').addEventListener('click', closeToc);
        tocOverlay.addEventListener('click', closeToc);

        window.jumpToPage = function (pageId) {
            closeToc();
            renderPages(pageId);
        };

        // Fullscreen Toggle
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // Simple Custom Modal for Alerts
        window.alertModal = function (message) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in';
            modal.innerHTML = `
                <div class="bg-white text-slate-800 p-6 rounded-2xl border border-slate-200 shadow-2xl max-w-sm w-full text-center space-y-4">
                    <i class="fa-solid fa-circle-check text-3xl text-amber-600"></i>
                    <p class="text-sm font-medium leading-relaxed">${message}</p>
                    <button onclick="this.closest('.fixed').remove()" class="w-full py-2 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-lg text-xs transition">
                        閉じる
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        };

        // Window Resize Handler
        window.addEventListener('resize', () => {
            updateResponsiveViewMode();
            renderPages(currentPage);
        });

        // Touch Swipe Gesture Support
        let touchStartX = 0;
        let touchEndX = 0;

        document.getElementById('book').addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.getElementById('book').addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 50;
            if (touchStartX - touchEndX > swipeThreshold) {
                nextPage();
            }
            if (touchEndX - touchStartX > swipeThreshold) {
                prevPage();
            }
        }

        // Initialize Reader Engine
        window.onload = function () {
            updateResponsiveViewMode();
            populateToc();
            renderPages(1);
        };
    </script>
</body>

</html>

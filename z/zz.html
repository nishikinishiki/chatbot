<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子書籍ビューア</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ========================================================
           CSS変数・リセット設定
        ======================================================== */
        :root {
            /* カラーパレット */
            --bg-color: #f1f5f9;
            --text-color: #334155;
            --heading-color: #0f172a;
            --border-color: #e2e8f0;
            --accent-color: #ca8a04;
            --paper-bg: #ffffff;
            --header-bg: rgba(255, 255, 255, 0.95);

            /* シャドウ */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ユーティリティ */
        .hidden {
            display: none !important;
        }

        /* ========================================================
           UIコンポーネント (ヘッダー, フッター, ボタンなど)
        ======================================================== */
        .header,
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
            height: 56px;
            background: var(--header-bg);
            z-index: 30;
            flex-shrink: 0;
            backdrop-filter: blur(4px);
        }

        .header {
            border-bottom: 1px solid var(--border-color);
        }

        .footer {
            border-top: 1px solid var(--border-color);
        }

        .header-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--heading-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60vw;
        }

        .header-left,
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-icon {
            background: transparent;
            border: none;
            padding: 0.5rem;
            border-radius: 6px;
            color: #64748b;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.2s;
        }

        .btn-icon:hover {
            background-color: var(--bg-color);
            color: var(--heading-color);
        }

        /* フッター機能 */
        .page-indicator {
            font-size: 0.85rem;
            font-weight: 500;
            min-width: 70px;
        }

        .page-indicator .current {
            color: var(--accent-color);
            font-weight: bold;
        }

        .slider-container {
            flex: 1;
            max-width: 500px;
            margin: 0 2rem;
            display: flex;
            align-items: center;
        }

        .range-slider {
            width: 100%;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .progress-text {
            font-size: 0.85rem;
            color: #64748b;
            min-width: 50px;
            text-align: right;
        }

        /* ナビゲーション矢印 */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            cursor: pointer;
            box-shadow: var(--shadow-md);
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .prev-btn {
            left: 1rem;
        }

        .next-btn {
            right: 1rem;
        }

        /* ========================================================
           電子書籍メインビューア領域
        ======================================================== */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 2rem;
            overflow: hidden;
            perspective: 2000px;
        }

        .book-wrapper {
            width: 100%;
            max-width: 1000px;
            height: 80vh;
            max-height: 900px;
            position: relative;
        }

        .page-spread {
            display: flex;
            width: 100%;
            height: 100%;
            background: var(--paper-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .page-card {
            display: flex;
            flex-direction: column;
            background: var(--paper-bg);
            position: relative;
        }

        /* 1Pモードと2Pモードの幅制御 */
        .page-card.half {
            width: 50%;
        }

        .page-card.full {
            width: 100%;
        }

        .page-card:first-child.half {
            border-right: 1px solid var(--border-color);
        }

        /* 立体感の影設定 */
        .left-page-shadow {
            box-shadow: inset -18px 0 24px -12px rgba(0, 0, 0, 0.06);
        }

        .right-page-shadow {
            box-shadow: inset 18px 0 24px -12px rgba(0, 0, 0, 0.06);
        }

        .page-footer {
            padding: 1rem 2rem;
            font-size: 0.75rem;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        /* 表紙用画像スペース */
        .cover-image-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #cbd5e1;
        }

        .cover-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* ========================================================
           文章スタイル定義 (h1, h2, h3, p, .note のみ)
        ======================================================== */
        .page-content {
            padding: 2.5rem;
            overflow-y: auto;
            flex: 1;
            /* スクロールバー装飾 */
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 0, 0, 0.15) rgba(0, 0, 0, 0.03);
        }

        .page-content::-webkit-scrollbar {
            width: 6px;
        }

        .page-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
        }

        .page-content::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 3px;
        }

        /* 見出しフォントは明朝体を指定 */
        .page-content h1,
        .page-content h2,
        .page-content h3 {
            font-family: 'Shippori Mincho', serif;
            color: var(--heading-color);
            font-weight: 700;
        }

        .page-content h1 {
            font-size: 1.6rem;
            margin-bottom: 2rem;
            line-height: 1.5;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
        }

        .page-content h2 {
            font-size: 1.3rem;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            border-left: 5px solid var(--accent-color);
            padding-left: 0.75rem;
            line-height: 1.4;
        }

        .page-content h3 {
            font-size: 1.1rem;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .page-content p {
            line-height: 1.9;
            margin-bottom: 1.2rem;
        }

        .page-content .note {
            display: block;
            font-size: 0.85em;
            color: #64748b;
            background: #f8fafc;
            padding: 0.75rem;
            border-radius: 4px;
            margin-top: 1rem;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        /* JSで切り替えるフォントサイズ制御 */
        .text-size-sm .page-content p {
            font-size: 0.85rem;
        }

        .text-size-base .page-content p {
            font-size: 1rem;
        }

        .text-size-lg .page-content p {
            font-size: 1.15rem;
        }

        /* ========================================================
           モーダル・サイドメニュー・設定パネル
        ======================================================== */
        /* 設定パネル */
        .settings-panel {
            position: fixed;
            top: 60px;
            right: 1rem;
            width: 250px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: var(--shadow-lg);
            z-index: 40;
        }

        .setting-group {
            margin-bottom: 1rem;
        }

        .setting-label {
            display: block;
            font-size: 0.8rem;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        .toggle-group {
            display: flex;
            background: var(--bg-color);
            border-radius: 8px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }

        .toggle-btn {
            flex: 1;
            padding: 0.5rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.85rem;
            border-radius: 6px;
            color: #64748b;
            transition: 0.2s;
        }

        /* 選択状態のアクティブクラス */
        .toggle-btn.active {
            background: white;
            font-weight: bold;
            color: var(--heading-color);
            box-shadow: var(--shadow-sm);
        }

        .toggle-btn.active-dark {
            background: #1e293b;
            color: white;
            font-weight: bold;
        }

        /* 目次ドロワー */
        .toc-drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px;
            max-width: 85vw;
            height: 100%;
            background: white;
            z-index: 50;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
        }

        .toc-drawer.open {
            transform: translateX(0);
        }

        .toc-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            font-weight: bold;
        }

        .toc-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .toc-item {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.75rem;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--bg-color);
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .toc-item:hover {
            background: var(--bg-color);
            color: var(--accent-color);
            padding-left: 1rem;
        }

        /* オーバーレイ */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            z-index: 45;
        }

        /* モーダル */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-card {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            text-align: center;
        }

        .modal-body img {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border-color);
        }

        .modal-footer {
            padding: 0.75rem;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            border-top: 1px solid var(--border-color);
        }

        /* レスポンシブ調整 */
        @media (max-width: 640px) {
            .main-content {
                padding: 0.5rem;
            }

            .page-content {
                padding: 1.5rem;
            }

            .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .header-title {
                max-width: 150px;
            }

            .slider-container {
                margin: 0 1rem;
            }
        }
    </style>
</head>

<body>
    <!-- ヘッダー -->
    <header class="header">
        <div class="header-left">
            <button id="tocBtn" class="btn-icon" title="目次を開く">
                <i class="fa-solid fa-list-ul"></i>
                <span style="font-size:0.85rem; font-weight:bold;" class="desktop-only">目次</span>
            </button>
            <div style="width: 1px; height: 16px; background: var(--border-color); margin: 0 8px;"></div>
            <h1 class="header-title">年収2500万円の税金対策と不動産投資</h1>
        </div>
        <div class="header-right">
            <button id="settingsBtn" class="btn-icon" title="表示設定">
                <i class="fa-solid fa-font"></i>
            </button>
            <button id="fullscreenBtn" class="btn-icon desktop-only" title="全画面表示">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>
    </header>

    <!-- 表示設定パネル -->
    <div id="settingsPanel" class="settings-panel hidden">
        <div class="setting-group">
            <span class="setting-label">文字の大きさ</span>
            <div class="toggle-group">
                <button data-size="sm" class="toggle-btn size-opt">小</button>
                <button data-size="base" class="toggle-btn size-opt active">中</button>
                <button data-size="lg" class="toggle-btn size-opt">大</button>
            </div>
        </div>
        <div class="setting-group">
            <span class="setting-label">表示モード</span>
            <div class="toggle-group" style="gap:4px; padding:4px;">
                <button id="viewModeTwo" class="toggle-btn active-dark" style="border-radius:4px;"><i class="fa-solid fa-book-open"></i> 見開き(2P)</button>
                <button id="viewModeOne" class="toggle-btn" style="border-radius:4px;"><i class="fa-solid fa-file"></i> 単ページ(1P)</button>
            </div>
        </div>
    </div>

    <!-- 目次ドロワー -->
    <div id="tocDrawer" class="toc-drawer">
        <div class="toc-header">
            <span><i class="fa-solid fa-book-bookmark" style="color:var(--accent-color);"></i> 目次</span>
            <button id="closeTocBtn" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="tocList" class="toc-list">
            <!-- JSで動的に追加 -->
        </div>
    </div>
    <div id="tocOverlay" class="overlay hidden"></div>

    <!-- メインビューア領域 -->
    <main class="main-content">
        <button id="prevBtn" class="nav-btn prev-btn"><i class="fa-solid fa-chevron-left"></i></button>
        <button id="nextBtn" class="nav-btn next-btn"><i class="fa-solid fa-chevron-right"></i></button>

        <div id="book" class="book-wrapper">
            <!-- ページのレンダリング先 -->
            <div id="pageSpread" class="page-spread"></div>
        </div>
    </main>

    <!-- モーダル (画像やテーブル拡大用) -->
    <div id="zoomModal" class="modal hidden">
        <div class="modal-card">
            <div class="modal-header">
                <span id="zoomModalTitle"><i class="fa-solid fa-magnifying-glass-plus"></i> 拡大表示</span>
                <button id="closeModalBtn" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="zoomModalBody" class="modal-body">
                <!-- コンテンツ挿入位置 -->
            </div>
            <div class="modal-footer">タップ/クリックまたは画面外を押して閉じます</div>
        </div>
    </div>

    <!-- フッター -->
    <footer class="footer">
        <div class="page-indicator">
            <span id="currentPageNum" class="current">1</span> / <span id="totalPagesNum">12</span> P
        </div>
        <div class="slider-container">
            <input type="range" id="pageSlider" min="1" max="12" value="1" class="range-slider">
        </div>
        <div id="progressPercent" class="progress-text">8%</div>
    </footer>

    <!-- JavaScript ロジック -->
    <script>
        /**
         * コンテンツデータ (h1, h2, h3, p, .note のみで構成)
         * 表紙ページは画像の差し込み用スペースとして定義。
         */
        const ebookData = {
            title: "年収2500万円の税金対策は不動産投資が鍵になる",
            pages: [
                {
                    id: 1,
                    chapterTitle: "表紙",
                    // 画像の差し込みスペース
                    content: `
                        <div class="cover-image-container">
                            <img src="test.png" alt="表紙画像">
                        </div>
                    `
                },
                {
                    id: 2,
                    chapterTitle: "はじめに",
                    content: `
                        <h1>はじめに</h1>
                        <p>「年収2500万円あれば、お金に困ることはないだろう」</p>
                        <p>そう思われがちですが、実際には高所得者ほど税金負担が重く、手取りは思ったよりも少ないのが現実です。</p>
                        <p>所得税・住民税・社会保険料といった各種税金は、年収が上がるほど比例して増えていき、気づけば毎年1,000万円以上を納税に充てているケースも珍しくないでしょう。所得税・住民税・社会保険料といった各種税金は、年収が上がるほど比例して増えていき、気づけば毎年1,000万円以上を納税に充てているケースも珍しくないでしょう。</p>
                        <p>サンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプルサンプル</p>
                        <p class="note">※これはサンプルの注釈です。実際の税負担は個別の状況により異なります。</p>
                    `
                },
                {
                    id: 3,
                    chapterTitle: "はじめに (続き)",
                    content: `
                        <h2>戦略的な税金対策の重要性</h2>
                        <p>使える控除や優遇制度を知らずに損をしている高収入の人も少なくありません。「税金は仕方ないもの」ではなく、「戦略的に対策するもの」という意識を持つと、将来の資産は大きく変わります。</p>
                        <p>本記事では、そんな高年収層の方向けに、有効な税金対策を具体的に解説します。基本的な制度から、本格的な手段まで解説します。</p>
                        <p>中でも注目したいのが「不動産投資による節税」です。給与所得と損益通算できる赤字を活用すれば、合法的に所得を圧縮し、税金を大幅に抑えることが可能なのです。</p>
                    `
                },
                {
                    id: 4,
                    chapterTitle: "1. 年収2500万円の税金と手取り",
                    content: `
                        <h1>1. 年収2500万円の税金と手取りはいくら？</h1>
                        <p>年収2500万円という水準は、「高収入」に分類される中でもトップクラスです。しかし、実際に手元に残る金額は想像よりも少なく、多くの人が税金の重さに驚かされます。</p>
                        <p>日本の所得税は「累進課税制度」に基づいているため、所得が高いほど税率が上がります。</p>
                        <h3>主な税率について</h3>
                        <p>1800万円〜3999万円の所得層では、所得税率が40%に達します。これに住民税の10%が加わると、およそ半額が税金として徴収される計算になります。</p>
                        <p class="note">引用：国税庁｜No.2260 所得税の税率に基づく参考値です。</p>
                    `
                },
                {
                    id: 5,
                    chapterTitle: "税負担の現実と専門家アドバイス",
                    content: `
                        <h2>手取り額のシミュレーション</h2>
                        <p>家族構成などの条件にもよりますが、所得税や住民税、社会保険料を合計すると、年間で930万円以上が徴収される計算になります。</p>

        // 状態管理
        let currentPage = 1;
        let viewMode = 'two'; // 'one' または 'two'
        let currentFontSize = 'base';

        // 画面幅による表示モードの自動切替
        function updateResponsiveViewMode() {
            if (window.innerWidth < 768) {
                viewMode = 'one';
            }

            // ボタンのUI切り替え
            document.getElementById('viewModeOne').className = (viewMode === 'one') ? 'toggle-btn active-dark' : 'toggle-btn';
            document.getElementById('viewModeTwo').className = (viewMode === 'two') ? 'toggle-btn active-dark' : 'toggle-btn';
        }

        // ページのレンダリング処理
        function renderPages(pageIndex) {
            const container = document.getElementById('pageSpread');
            const total = ebookData.pages.length;

            if (pageIndex < 1) pageIndex = 1;
            if (pageIndex > total) pageIndex = total;

            // 2Pモードで左側を奇数ページにする調整
            if (viewMode === 'two' && pageIndex % 2 === 0 && pageIndex > 1) {
                pageIndex = pageIndex - 1;
            }
            currentPage = pageIndex;

            const fontClass = `text-size-${currentFontSize}`;
            let html = '';

            if (viewMode === 'two') {
                const leftData = ebookData.pages[pageIndex - 1];
                const rightData = ebookData.pages[pageIndex];

                // 左ページ
                html += `
                    <div class="page-card half left-page-shadow ${fontClass}">
                        ${leftData ? `
                            ${leftData.id === 1 ? leftData.content : `<div class="page-content">${leftData.content}</div>`}
                            <div class="page-footer">
                                <span>${leftData.chapterTitle || ebookData.title}</span>
                                <span>${leftData.id}</span>
                            </div>
                        ` : ''}
                    </div>
                `;

                // 右ページ
                html += `
                    <div class="page-card half right-page-shadow ${fontClass}">
                        ${rightData ? `
                            <div class="page-content">${rightData.content}</div>
                            <div class="page-footer">
                                <span>${rightData.id}</span>
                                <span>${rightData.chapterTitle || ''}</span>
                            </div>
                        ` : ''}
                    </div>
                `;
            } else {
                // 単一ページモード
                const singleData = ebookData.pages[pageIndex - 1];
                html = `
                    <div class="page-card full left-page-shadow ${fontClass}">
                        ${singleData.id === 1 ? singleData.content : `<div class="page-content">${singleData.content}</div>`}
                        <div class="page-footer">
                            <span>${singleData.chapterTitle || ebookData.title}</span>
                            <span>${singleData.id} / ${total}</span>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;

            // UI状態の更新
            document.getElementById('currentPageNum').innerText = currentPage;
            document.getElementById('totalPagesNum').innerText = total;
            document.getElementById('pageSlider').value = currentPage;
            document.getElementById('pageSlider').max = total;
            document.getElementById('progressPercent').innerText = `${Math.round((currentPage / total) * 100)}%`;

            // ボタンの活性・非活性
            document.getElementById('prevBtn').disabled = (currentPage <= 1);
            document.getElementById('nextBtn').disabled = (viewMode === 'two' ? currentPage >= total - 1 : currentPage >= total);
        }

        // ページ遷移処理
        function nextPage() {
            const step = (viewMode === 'two') ? 2 : 1;
            if (currentPage + step <= ebookData.pages.length + (viewMode === 'two' ? 1 : 0)) {
                renderPages(currentPage + step);
            }
        }

        function prevPage() {
            const step = (viewMode === 'two') ? 2 : 1;
            if (currentPage - step >= 1) {
                renderPages(currentPage - step);
            }
        }

        // イベントリスナー設定
        document.getElementById('nextBtn').addEventListener('click', nextPage);
        document.getElementById('prevBtn').addEventListener('click', prevPage);

        document.getElementById('pageSlider').addEventListener('input', (e) => {
            renderPages(parseInt(e.target.value));
        });

        // キーボード操作
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextPage();
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevPage();
            if (e.key === 'Escape') closeModal();
        });

        // 設定パネルトグル
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        settingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('hidden');
        });

        // フォントサイズ変更
        document.querySelectorAll('.size-opt').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentFontSize = e.target.getAttribute('data-size');
                document.querySelectorAll('.size-opt').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderPages(currentPage);
            });
        });

        // モード変更
        document.getElementById('viewModeOne').addEventListener('click', () => {
            viewMode = 'one';
            updateResponsiveViewMode();
            renderPages(currentPage);
        });

        document.getElementById('viewModeTwo').addEventListener('click', () => {
            viewMode = 'two';
            updateResponsiveViewMode();
            renderPages(currentPage);
        });

        // 目次機能
        const tocDrawer = document.getElementById('tocDrawer');
        const tocOverlay = document.getElementById('tocOverlay');
        const tocList = document.getElementById('tocList');

        function populateToc() {
            tocList.innerHTML = ebookData.pages.map(p => `
                <button onclick="jumpToPage(${p.id})" class="toc-item">
                    ${p.id}. ${p.chapterTitle || '表紙'}
                </button>
            `).join('');
        }

        function openToc() {
            tocDrawer.classList.add('open');
            tocOverlay.classList.remove('hidden');
        }

        function closeToc() {
            tocDrawer.classList.remove('open');
            tocOverlay.classList.add('hidden');
        }

        window.jumpToPage = function (pageId) {
            closeToc();
            renderPages(pageId);
        };

        document.getElementById('tocBtn').addEventListener('click', openToc);
        document.getElementById('closeTocBtn').addEventListener('click', closeToc);
        tocOverlay.addEventListener('click', closeToc);

        // フルスクリーン
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        });

        // モーダル機能 (本バージョンでは画像拡大用等で利用可能)
        function openModal(imageSrc) {
            document.getElementById('zoomModalBody').innerHTML = `<img src="${imageSrc}" alt="拡大画像">`;
            document.getElementById('zoomModal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('zoomModal').classList.add('hidden');
        }
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('zoomModal').addEventListener('click', (e) => {
            if (e.target.id === 'zoomModal') closeModal();
        });

        // スワイプ処理
        let touchStartX = 0;
        let touchEndX = 0;
        const bookEl = document.getElementById('book');

        bookEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        bookEl.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) nextPage();
            if (touchEndX - touchStartX > 50) prevPage();
        }, { passive: true });

        // 初期化処理
        window.addEventListener('resize', () => {
            updateResponsiveViewMode();
            renderPages(currentPage);
        });

        window.onload = function () {
            updateResponsiveViewMode();
            populateToc();
            renderPages(1);
        };
    </script>

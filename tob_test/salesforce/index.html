<!doctype html>
<html lang="ja">
<head>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-TCL9ZH6');</script>
  <!-- End Google Tag Manager -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#33b5a7">
  <title></title>
  <meta id="metaDescription" name="description" content="">
  <link id="favicon" rel="icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TCL9ZH6" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <main class="layout">
    <aside id="visualPane" class="visual-pane">
      <img id="visualImage" class="visual-image" loading="eager">
    </aside>

    <section id="formPane" class="form-pane">
      <div class="form-shell">
        <div class="brand">
          <span id="brandMark" class="brand-mark" aria-hidden="true"></span>
          <span id="brandName"></span>
          <span id="brandCaption" class="brand-caption"></span>
        </div>

        <section id="initialStep" class="page-view">
          <header class="form-heading">
            <p id="leadEyebrow" class="eyebrow"></p>
            <h1 id="leadHeading"></h1>
            <p id="leadIntro" class="intro"></p>
          </header>
          <nav id="stepper" class="stepper">
            <div class="progress-track" aria-hidden="true"><span class="progress-fill" id="progressFill"></span></div>
            <ol id="stepperList" class="stepper-list"></ol>
          </nav>
          <form id="leadForm" novalidate>
            <div class="panel-stage" id="panelStage"></div>
          </form>
        </section>

        <section id="appointmentStep" class="page-view" hidden>
          <div id="appointmentEyebrow" class="eyebrow"></div>
          <h1 id="appointmentHeading"></h1>
          <p id="appointmentIntro" class="intro"></p>
          <form id="appointmentForm" novalidate>
            <div id="appointmentSections"></div>
            <p id="appointmentError" class="error-message" role="alert" aria-live="polite"></p>
            <button id="appointmentSubmit" type="submit" class="primary-button"></button>
          </form>
        </section>

        <section id="completeStep" class="page-view" hidden>
          <div id="completeIcon" class="complete-icon" aria-hidden="true"></div>
          <h1 id="completeHeading"></h1>
          <p id="completeIntro" class="intro"></p>
          <a id="completeLink" class="primary-button as-link" target="_blank" rel="noopener noreferrer"></a>
          <button type="button" id="restartButton" class="secondary-button"></button>
        </section>

        <footer id="siteFooter" class="footer"></footer>
      </div>
    </section>
  </main>
  <script src="./question.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>

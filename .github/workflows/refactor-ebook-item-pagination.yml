name: Refactor ebook item pagination

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refactor-ebook-item-pagination.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pagination refactor
        run: python .github/scripts/refactor_ebook_item_pagination.py

      - name: Validate JavaScript and change scope
        shell: bash
        run: |
          node --check zz_ebook/shared/viewer.js
          git diff --check
          test "$(git diff --name-only)" = "zz_ebook/shared/viewer.js"

      - name: Verify shared pagination structure
        shell: bash
        run: |
          grep -q 'function paginateOversizedInlineItem' zz_ebook/shared/viewer.js
          grep -q 'function paginateItemCollection' zz_ebook/shared/viewer.js
          grep -q 'function paginateList(block, chapterIndex)' zz_ebook/shared/viewer.js
          grep -q 'function paginateFootnotes(block, chapterIndex)' zz_ebook/shared/viewer.js
          grep -q 'protectTrailingHeading: true' zz_ebook/shared/viewer.js
          test "$(grep -c 'findLargestFittingInlinePrefix(' zz_ebook/shared/viewer.js)" -eq 3
          test "$(grep -c 'let addedItems = 0;' zz_ebook/shared/viewer.js)" -eq 1
          ! grep -q 'function paginateOversizedFootnote(itemData, chapterIndex) {' <(git show HEAD:zz_ebook/shared/viewer.js) || true

      - name: Guard unrelated ebook files
        shell: bash
        run: |
          if git diff --name-only | grep -qE 'style\.css$|(^|/)data\.js$'; then
            echo "This refactor must not modify style.css or data.js"
            exit 1
          fi

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zz_ebook/shared/viewer.js
          git commit -m "Unify list and footnote pagination"
          git push origin main

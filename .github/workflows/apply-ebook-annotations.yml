name: Apply ebook annotation support

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ebook-annotations.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch shared ebook viewer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          viewer_path = Path("zz_ebook/shared/viewer.js")
          style_path = Path("zz_ebook/shared/style.css")

          viewer = viewer_path.read_text(encoding="utf-8")
          style = style_path.read_text(encoding="utf-8")

          # ---------- Footnote reference encoding helpers ----------
          parser_marker = "    function parseBookMarkdown(md) {"
          if parser_marker not in viewer:
              raise SystemExit("parseBookMarkdown marker not found")

          helpers = r'''    const FOOTNOTE_REF_BASE = 0xE000;
          const FOOTNOTE_REF_LIMIT = 255;

          function encodeFootnoteReference(number) {
              if (number < 1 || number > FOOTNOTE_REF_LIMIT) {
                  return `[${number}]`;
              }

              return String.fromCharCode(FOOTNOTE_REF_BASE + number);
          }

          function getFootnoteReferenceNumber(char) {
              if (!char) return null;

              const code = char.charCodeAt(0);
              const number = code - FOOTNOTE_REF_BASE;

              return number >= 1 && number <= FOOTNOTE_REF_LIMIT
                  ? number
                  : null;
          }

          '''

          if "const FOOTNOTE_REF_BASE" not in viewer:
              viewer = viewer.replace(parser_marker, helpers + parser_marker, 1)

          # ---------- Markdown parser ----------
          parser_start = viewer.index("        let currentChapter = null;", viewer.index(parser_marker))
          parser_end_marker = "        flushTextBlocks();\n        return book;"
          parser_end = viewer.index(parser_end_marker, parser_start) + len(parser_end_marker)

          new_parser = r'''        let currentChapter = null;
          let paragraphBuffer = [];
          let currentList = null;
          let currentNote = null;
          let currentFootnote = null;

          function flushParagraph() {
              if (!paragraphBuffer.length || !currentChapter) {
                  paragraphBuffer = [];
                  return;
              }

              currentChapter.blocks.push({
                  type: "paragraph",
                  text: paragraphBuffer.join("\n")
              });
              paragraphBuffer = [];
          }

          function flushList() {
              if (!currentList || !currentChapter) {
                  currentList = null;
                  return;
              }

              currentChapter.blocks.push(currentList);
              currentList = null;
          }

          function flushNote() {
              if (!currentNote || !currentChapter) {
                  currentNote = null;
                  return;
              }

              currentChapter.blocks.push({
                  type: "note",
                  text: currentNote.join("\n")
              });
              currentNote = null;
          }

          function flushFootnote() {
              if (!currentFootnote || !currentChapter) {
                  currentFootnote = null;
                  return;
              }

              currentChapter.footnotes.set(
                  currentFootnote.id,
                  currentFootnote.lines.join("\n").trim()
              );
              currentFootnote = null;
          }

          function flushTextBlocks() {
              flushParagraph();
              flushList();
          }

          function replaceFootnoteReferences(text, chapter, order, numbers) {
              return text.replace(/\[\^([^\]]+)\]/g, (match, rawId) => {
                  const id = rawId.trim();
                  if (!chapter.footnotes.has(id)) return match;

                  if (!numbers.has(id)) {
                      const number = numbers.size + 1;
                      numbers.set(id, number);
                      order.push(id);
                  }

                  return encodeFootnoteReference(numbers.get(id));
              });
          }

          function finalizeChapterFootnotes(chapter) {
              if (!chapter.footnotes?.size) {
                  delete chapter.footnotes;
                  return;
              }

              const order = [];
              const numbers = new Map();

              chapter.blocks.forEach((block) => {
                  if (
                      block.type === "paragraph" ||
                      block.type === "h2" ||
                      block.type === "note"
                  ) {
                      block.text = replaceFootnoteReferences(
                          block.text,
                          chapter,
                          order,
                          numbers
                      );
                      return;
                  }

                  if (block.type === "list") {
                      block.items = block.items.map((item) =>
                          replaceFootnoteReferences(
                              item,
                              chapter,
                              order,
                              numbers
                          )
                      );
                  }
              });

              if (order.length) {
                  chapter.blocks.push({
                      type: "list",
                      ordered: true,
                      start: 1,
                      footnotes: true,
                      items: order.map((id) => chapter.footnotes.get(id))
                  });
              }

              delete chapter.footnotes;
          }

          body.split("\n").forEach((rawLine) => {
              const line = rawLine.trim();

              if (currentFootnote) {
                  const continuation = rawLine.match(/^(?: {4}|\t)(.*)$/);
                  if (continuation) {
                      currentFootnote.lines.push(continuation[1]);
                      return;
                  }

                  flushFootnote();
              }

              if (currentNote) {
                  const noteLine = rawLine.match(/^\s*>\s?(.*)$/);
                  if (noteLine) {
                      currentNote.push(noteLine[1]);
                      return;
                  }

                  flushNote();
              }

              if (!line) {
                  flushTextBlocks();
                  return;
              }

              if (line.startsWith("# ")) {
                  flushTextBlocks();
                  currentChapter = {
                      title: line.replace(/^#\s+/, ""),
                      blocks: [],
                      footnotes: new Map()
                  };
                  book.chapters.push(currentChapter);
                  return;
              }

              if (!currentChapter) return;

              if (line.startsWith("## ")) {
                  flushTextBlocks();
                  currentChapter.blocks.push({
                      type: "h2",
                      text: line.replace(/^##\s+/, "")
                  });
                  return;
              }

              const footnoteDefinition = line.match(/^\[\^([^\]]+)\]:\s*(.*)$/);
              if (footnoteDefinition) {
                  flushTextBlocks();
                  currentFootnote = {
                      id: footnoteDefinition[1].trim(),
                      lines: [footnoteDefinition[2]]
                  };
                  return;
              }

              if (/^>\s*\[!NOTE\]\s*$/i.test(line)) {
                  flushTextBlocks();
                  currentNote = [];
                  return;
              }

              const image = line.match(/^!\[(.*?)\]\((.*?)\)(\{page\})?$/);
              if (image) {
                  flushTextBlocks();
                  currentChapter.blocks.push({
                      type: image[3] ? "full-image" : "image",
                      alt: image[1],
                      src: image[2]
                  });
                  return;
              }

              const unorderedListItem = line.match(/^[-*+]\s+(.+)$/);
              if (unorderedListItem) {
                  flushParagraph();

                  if (!currentList || currentList.ordered) {
                      flushList();
                      currentList = {
                          type: "list",
                          ordered: false,
                          items: []
                      };
                  }

                  currentList.items.push(unorderedListItem[1]);
                  return;
              }

              const orderedListItem = line.match(/^(\d+)\.\s+(.+)$/);
              if (orderedListItem) {
                  flushParagraph();

                  if (!currentList || !currentList.ordered) {
                      flushList();
                      currentList = {
                          type: "list",
                          ordered: true,
                          start: Number(orderedListItem[1]),
                          items: []
                      };
                  }

                  currentList.items.push(orderedListItem[2]);
                  return;
              }

              flushList();
              paragraphBuffer.push(line);
          });

          flushFootnote();
          flushNote();
          flushTextBlocks();
          book.chapters.forEach(finalizeChapterFootnotes);
          return book;'''

          viewer = viewer[:parser_start] + new_parser + viewer[parser_end:]

          # ---------- Inline footnote refs + NOTE rendering ----------
          render_start = viewer.index("    function createParagraph(text, continuation = false) {")
          render_end = viewer.index("    function createList(", render_start)

          new_render = r'''    function appendInlineText(parent, text) {
              let plainText = "";

              const flushPlainText = () => {
                  if (!plainText) return;
                  parent.appendChild(document.createTextNode(plainText));
                  plainText = "";
              };

              for (const char of text) {
                  const number = getFootnoteReferenceNumber(char);
                  if (number == null) {
                      plainText += char;
                      continue;
                  }

                  flushPlainText();
                  const reference = document.createElement("sup");
                  reference.className = "footnote-ref";
                  reference.textContent = String(number);
                  reference.setAttribute("aria-label", `注釈 ${number}`);
                  parent.appendChild(reference);
              }

              flushPlainText();
          }

          function appendMultilineInlineText(parent, text) {
              text.split("\n").forEach((line, index) => {
                  if (index > 0) {
                      parent.appendChild(document.createElement("br"));
                  }
                  appendInlineText(parent, line);
              });
          }

          function createInlineTextElement(tag, text, className = "") {
              const element = document.createElement(tag);
              if (className) element.className = className;
              appendInlineText(element, text);
              return element;
          }

          function createParagraph(text, continuation = false) {
              const paragraph = createTextElement(
                  "p",
                  "",
                  continuation ? "continuation" : ""
              );

              appendMultilineInlineText(paragraph, text);
              return paragraph;
          }

          function createNote(text, continuation = false) {
              const note = document.createElement("aside");
              note.className = continuation
                  ? "book-note book-note--continuation"
                  : "book-note";

              if (!continuation) {
                  note.appendChild(
                      createTextElement("div", "注記", "book-note__label")
                  );
              }

              const body = document.createElement("div");
              body.className = "book-note__text";
              appendMultilineInlineText(body, text);
              note.appendChild(body);

              return note;
          }

          '''

          viewer = viewer[:render_start] + new_render + viewer[render_end:]

          # ---------- List rendering: footnotes share existing pagination ----------
          list_start = viewer.index("    function createList(")
          list_end = viewer.index("    function createImageBlock(", list_start)

          new_list = r'''    function createList(block, items = block.items, start = block.start ?? 1, continuation = false) {
              const list = document.createElement(block.ordered ? "ol" : "ul");
              const classNames = ["book-list"];

              if (block.footnotes) classNames.push("book-footnotes");
              if (continuation) classNames.push("book-list--continuation");
              list.className = classNames.join(" ");

              if (block.ordered && start !== 1) {
                  list.start = start;
              }

              items.forEach((text) => {
                  const item = document.createElement("li");
                  appendMultilineInlineText(item, text);
                  list.appendChild(item);
              });

              return list;
          }

          '''

          viewer = viewer[:list_start] + new_list + viewer[list_end:]

          # ---------- NOTE pagination ----------
          note_pagination_marker = "    function findLargestFittingListItemPrefix(block, itemText, start, continuation) {"
          if note_pagination_marker not in viewer:
              raise SystemExit("list pagination marker not found")

          note_pagination = r'''    function findLargestFittingNotePrefix(noteText, continuation) {
              let low = 1;
              let high = noteText.length;
              let best = 0;

              while (low <= high) {
                  const mid = Math.floor((low + high) / 2);
                  const node = createNote(noteText.slice(0, mid), continuation);
                  els.measureBody.appendChild(node);

                  const fits = fitsMeasureBody();
                  node.remove();

                  if (fits) {
                      best = mid;
                      low = mid + 1;
                  } else {
                      high = mid - 1;
                  }
              }

              return best;
          }

          function paginateNote(text, chapterIndex) {
              let remaining = text;
              let continuation = false;

              while (remaining.length > 0) {
                  const fullNode = createNote(remaining, continuation);
                  els.measureBody.appendChild(fullNode);

                  if (fitsMeasureBody()) return;

                  fullNode.remove();

                  if (!continuation && els.measureBody.innerHTML.trim()) {
                      commitMeasuredPage(chapterIndex);
                      continue;
                  }

                  const fittingLength = findLargestFittingNotePrefix(
                      remaining,
                      continuation
                  );

                  if (fittingLength === 0) {
                      if (els.measureBody.innerHTML.trim()) {
                          commitMeasuredPage(chapterIndex);
                          continue;
                      }

                      const fallbackText = remaining.slice(0, 1);
                      els.measureBody.appendChild(
                          createNote(fallbackText, continuation)
                      );
                      commitMeasuredPage(chapterIndex);
                      remaining = remaining.slice(1);
                      continuation = true;
                      continue;
                  }

                  const fittingText = remaining.slice(0, fittingLength);
                  els.measureBody.appendChild(
                      createNote(fittingText, continuation)
                  );
                  commitMeasuredPage(chapterIndex);

                  remaining = remaining.slice(fittingLength);
                  continuation = true;
              }
          }

          '''

          if "function paginateNote(" not in viewer:
              viewer = viewer.replace(
                  note_pagination_marker,
                  note_pagination + note_pagination_marker,
                  1
              )

          # Existing paginator creates list items directly; render passive footnote refs there too.
          old_item = '                const item = createTextElement("li", block.items[index]);'
          new_item = '                const item = document.createElement("li");\n                appendMultilineInlineText(item, block.items[index]);'
          if old_item not in viewer:
              raise SystemExit("paginateList item marker not found")
          viewer = viewer.replace(old_item, new_item, 1)

          # h2 can contain footnote references.
          old_h2 = '                        const node = createTextElement("h2", block.text);'
          new_h2 = '                        const node = createInlineTextElement("h2", block.text);'
          if old_h2 not in viewer:
              raise SystemExit("h2 render marker not found")
          viewer = viewer.replace(old_h2, new_h2, 1)

          # NOTE joins the same block switch as paragraph/list/image.
          list_case = '''                    case "list":
                          paginateList(block, chapterIndex);
                          break;'''
          note_and_list_case = '''                    case "note":
                          paginateNote(block.text, chapterIndex);
                          break;
                      case "list":
                          paginateList(block, chapterIndex);
                          break;'''
          if list_case not in viewer:
              raise SystemExit("paginateBook list case marker not found")
          viewer = viewer.replace(list_case, note_and_list_case, 1)

          # ---------- CSS ----------
          css_marker = ''':where(.page-body, .measure-body) .book-list--continuation {
              list-style: none;
          }
          '''
          if css_marker not in style:
              raise SystemExit("book-list CSS marker not found")

          annotation_css = r'''
          :where(.page-body, .measure-body) .footnote-ref {
              margin-left: 0.08em;
              font-size: 0.68em;
              font-weight: 600;
              line-height: 1;
              vertical-align: super;
              pointer-events: none;
          }

          :where(.page-body, .measure-body) .book-note {
              margin: 1em 0 1.25em;
              padding: 0.8em 1em;
              border-left: 3px solid var(--line);
              background: var(--chrome-bg);
              font-size: 0.85em;
              line-height: 1.65;
              text-align: left;
          }

          :where(.page-body, .measure-body) .book-note__label {
              margin-bottom: 0.35em;
              color: var(--text);
              font-size: 0.9em;
              font-weight: 600;
          }

          :where(.page-body, .measure-body) .book-note__text {
              color: var(--text-secondary);
              overflow-wrap: anywhere;
          }

          :where(.page-body, .measure-body) .book-note--continuation {
              margin-top: 0;
          }

          :where(.page-body, .measure-body) .book-footnotes {
              margin-top: 1.5em;
              padding-top: 0.8em;
              border-top: 1px solid var(--line);
              color: var(--text-secondary);
              font-size: 0.78em;
              font-weight: 400;
              line-height: 1.6;
              text-align: left;
          }

          :where(.page-body, .measure-body) .book-footnotes::before {
              content: "注釈";
              display: block;
              margin: 0 0 0.5em -1.75em;
              color: var(--text);
              font-weight: 600;
          }

          :where(.page-body, .measure-body) .book-footnotes li {
              margin-bottom: 0.4em;
          }

          :where(.page-body, .measure-body) .book-footnotes li:last-child {
              margin-bottom: 0;
          }
          '''

          if ".book-note__label" not in style:
              style = style.replace(css_marker, css_marker + annotation_css, 1)

          viewer_path.write_text(viewer, encoding="utf-8")
          style_path.write_text(style, encoding="utf-8")
          PY

      - name: Validate JavaScript and diff
        shell: bash
        run: |
          node --check zz_ebook/shared/viewer.js
          git diff --check
          grep -q 'case "note"' zz_ebook/shared/viewer.js
          grep -q 'book-footnotes' zz_ebook/shared/style.css

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zz_ebook/shared/viewer.js zz_ebook/shared/style.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Markdown notes and footnotes to ebook viewer"
          git push origin main

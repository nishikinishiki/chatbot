name: Refactor ebook CSS

on:
  push:
    paths:
      - .github/workflows/refactor-ebook-css.yml
      - .github/scripts/refactor_ebook_css.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor CSS and DOM
        run: python .github/scripts/refactor_ebook_css.py
      - name: Validate JavaScript
        run: node --check zz_ebook/shared/viewer.js
      - name: Validate expected cleanup
        shell: bash
        run: |
          ! grep -q 'class="app"' zz_ebook/shared/viewer.js
          ! grep -q 'els.app' zz_ebook/shared/viewer.js
          ! grep -q -- '--topbar-height\|--bottombar-height' zz_ebook/shared/style.css
          ! grep -q '\.app\.overview' zz_ebook/shared/style.css
          ! grep -q 'overview-strip::before\|overview-strip::after' zz_ebook/shared/style.css
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zz_ebook/shared/viewer.js zz_ebook/shared/style.css
          git commit -m "Simplify ebook CSS structure"
          git push

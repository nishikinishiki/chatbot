name: Temporary simplify ebook spread layout

on:
  push:
    paths:
      - .github/workflows/temporary-simplify-spread-layout.yml
      - .github/scripts/temporary_simplify_spread_layout.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Simplify spread layout CSS
        run: python .github/scripts/temporary_simplify_spread_layout.py

      - name: Validate simplification
        shell: bash
        run: |
          ! grep -q -- '--reader-content-max-width\|--reader-gutter-padding\|--reader-outer-padding' zz_ebook/shared/style.css
          ! grep -q 'page-card--prev.*display' zz_ebook/shared/style.css
          grep -q 'max-width: 720px' zz_ebook/shared/style.css
          grep -q 'align-items: flex-end' zz_ebook/shared/style.css
          grep -q 'align-items: flex-start' zz_ebook/shared/style.css
          node --check zz_ebook/shared/viewer.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zz_ebook/shared/style.css
          git commit -m "Simplify ebook spread layout"
          git push

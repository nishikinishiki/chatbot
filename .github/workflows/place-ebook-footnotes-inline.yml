name: Place ebook footnotes inline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/place-ebook-footnotes-inline.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply inline footnote patch
        run: python .github/scripts/place_ebook_footnotes_inline.py

      - name: Validate implementation
        shell: bash
        run: |
          node --check zz_ebook/shared/viewer.js
          git diff --check
          test "$(git diff --name-only)" = "zz_ebook/shared/viewer.js"
          grep -q 'items: \[`\${currentFootnote.id}　\${text}`\]' zz_ebook/shared/viewer.js
          grep -q 'block.type === "list" && !block.footnotes' zz_ebook/shared/viewer.js
          if grep -q 'items: order.map' zz_ebook/shared/viewer.js; then
            echo "chapter-end footnote aggregation still exists"
            exit 1
          fi

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zz_ebook/shared/viewer.js
          git commit -m "Render ebook footnotes at Markdown position"
          git push origin main

name: Temporary ebook slider patch

on:
  push:
    paths:
      - .github/workflows/temporary-ebook-slider-patch.yml

permissions:
  contents: write

jobs:
  patch-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch viewer.js
        run: python .github/scripts/temporary_patch_ebook_slider.py
      - name: Validate viewer.js
        run: node --check zz_ebook/shared/viewer.js
      - name: Commit patched viewer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zz_ebook/shared/viewer.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make overview slider continuous"
          git push

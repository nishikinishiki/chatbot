name: Temporary ebook slider patch

on:
  push:
    paths:
      - .github/workflows/temporary-ebook-slider-patch.yml

permissions:
  contents: write

jobs:
  patch-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch viewer.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('zz_ebook/shared/viewer.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'id="pageSlider" type="range" min="1" max="1" step="1" value="1"',
              'id="pageSlider" type="range" min="1" max="1" step="any" value="1"'
          )
          text = text.replace('ピンチ / ホイールで拡大', 'ピンチで拡大')

          old_sync = '''    function syncPageFromOverviewScroll() {
        cancelAnimationFrame(overviewInteraction.scrollRaf);

        overviewInteraction.scrollRaf = requestAnimationFrame(() => {
            const step = getOverviewStep();
            if (!step || step <= 0) return;

            const index = clampPageIndex(
                Math.round(els.overviewScroller.scrollLeft / step)
            );

            if (index !== state.currentPage) {
                setCurrentPage(index);
            }
        });
    }
'''

          new_sync = '''    function syncPageFromOverviewScroll() {
        cancelAnimationFrame(overviewInteraction.scrollRaf);

        overviewInteraction.scrollRaf = requestAnimationFrame(() => {
            const step = getOverviewStep();
            if (!step || step <= 0) return;

            const maxScroll = Math.max(
                0,
                els.overviewScroller.scrollWidth - els.overviewScroller.clientWidth
            );
            const progress = maxScroll > 0
                ? els.overviewScroller.scrollLeft / maxScroll
                : 0;
            const sliderMax = Math.max(1, state.pages.length);
            const sliderValue = 1 + progress * Math.max(0, sliderMax - 1);

            const index = clampPageIndex(
                Math.round(els.overviewScroller.scrollLeft / step)
            );

            if (index !== state.currentPage) {
                setCurrentPage(index);
            }

            els.pageSlider.value = String(sliderValue);
        });
    }
'''

          if old_sync not in text:
              raise SystemExit('syncPageFromOverviewScroll block not found')
          text = text.replace(old_sync, new_sync)

          old_slider = '''    els.pageSlider.addEventListener("input", (event) => {
        const target = clampPageIndex(Number(event.target.value) - 1);

        setCurrentPage(target, {
            render: state.mode === "normal"
        });

        if (state.mode === "overview") {
            scrollOverviewToPage(target, "auto");
        }
    });
'''

          new_slider = '''    els.pageSlider.addEventListener("input", (event) => {
        const value = Number(event.target.value);

        if (state.mode === "overview") {
            const sliderMax = Math.max(1, state.pages.length);
            const progress = sliderMax > 1
                ? clamp((value - 1) / (sliderMax - 1), 0, 1)
                : 0;
            const maxScroll = Math.max(
                0,
                els.overviewScroller.scrollWidth - els.overviewScroller.clientWidth
            );

            els.overviewScroller.scrollLeft = progress * maxScroll;
            return;
        }

        setCurrentPage(Math.round(value) - 1, { render: true });
    });
'''

          if old_slider not in text:
              raise SystemExit('page slider input block not found')
          text = text.replace(old_slider, new_slider)

          wheel_pattern = re.compile(
              r'''\n    els\.imageViewerViewport\.addEventListener\("wheel", \(event\) => \{.*?\n    \}, \{ passive: false \}\);\n''',
              re.S
          )
          text, count = wheel_pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit('wheel zoom block not found')

          path.write_text(text, encoding='utf-8')
          PY

          node --check zz_ebook/shared/viewer.js

      - name: Commit patched viewer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zz_ebook/shared/viewer.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make overview slider continuous"
          git push

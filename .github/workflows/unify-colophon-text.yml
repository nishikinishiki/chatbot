name: Unify colophon text class

on:
  push:
    branches: [main]
    paths:
      - 'zz copy/.unify-colophon-text'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unify colophon text class
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          viewer = Path('zz copy/shared/viewer.js')
          style = Path('zz copy/shared/style.css')

          js = viewer.read_text(encoding='utf-8')
          js = js.replace('className: "colophon__paragraph"', 'className: "colophon__text"')
          if 'colophon__paragraph' in js:
              raise RuntimeError('colophon__paragraph remains in viewer.js')
          viewer.write_text(js, encoding='utf-8')

          css = style.read_text(encoding='utf-8')
          css, count = re.subn(
              r'\n\.colophon__paragraph \{\n[\s\S]*?\n\}\n',
              '\n',
              css,
              count=1,
          )
          if count != 1:
              raise RuntimeError('colophon__paragraph CSS not found')
          if 'colophon__paragraph' in css:
              raise RuntimeError('colophon__paragraph remains in style.css')
          style.write_text(css, encoding='utf-8')
          PY

          node --check 'zz copy/shared/viewer.js'
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'zz copy/shared/viewer.js' 'zz copy/shared/style.css'
          git commit -m 'Unify colophon text styling'
          git push

name: Temporary remove overview snap

on:
  push:
    paths:
      - .github/workflows/temporary-remove-overview-snap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove overview scroll snap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('zz_ebook/shared/style.css')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    scroll-snap-type: x proximity;\n', '')
          s = s.replace('    scroll-snap-align: center;\n', '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          ! grep -q 'scroll-snap-type' zz_ebook/shared/style.css
          ! grep -q 'scroll-snap-align' zz_ebook/shared/style.css
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zz_ebook/shared/style.css
          git commit -m "Remove overview scroll snapping"
          git push

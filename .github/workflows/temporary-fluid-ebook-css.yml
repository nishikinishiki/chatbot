name: Temporary fluid ebook CSS refactor

on:
  push:
    paths:
      - .github/workflows/temporary-fluid-ebook-css.yml
      - .github/scripts/temporary_fluid_ebook_css.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make one-page layout fluid
        run: python .github/scripts/temporary_fluid_ebook_css.py

      - name: Validate CSS structure
        shell: bash
        run: |
          ! grep -q '@media (max-width: 720px)' zz_ebook/shared/style.css
          ! grep -q -- '--page-padding-top\|--page-padding-bottom' zz_ebook/shared/style.css
          grep -q -- '--page-padding-y:' zz_ebook/shared/style.css
          grep -q 'clamp(24px' zz_ebook/shared/style.css
          grep -q '@media (min-width: 1024px)' zz_ebook/shared/style.css
          python - <<'PY'
          from pathlib import Path
          css = Path('zz_ebook/shared/style.css').read_text(encoding='utf-8')
          depth = 0
          for ch in css:
              if ch == '{':
                  depth += 1
              elif ch == '}':
                  depth -= 1
              if depth < 0:
                  raise SystemExit('unbalanced CSS braces')
          if depth != 0:
              raise SystemExit('unbalanced CSS braces')
          PY

      - name: Validate JavaScript
        run: node --check zz_ebook/shared/viewer.js

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zz_ebook/shared/style.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make ebook layout fluid below spread mode"
          git push

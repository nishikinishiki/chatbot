name: Restore page turn shadow

on:
  push:
    branches: [main]
    paths:
      - 'zz copy/.restore-page-turn-shadow'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore page turn shadow
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('zz copy/shared/style.css')
          css = path.read_text(encoding='utf-8')

          old_transition = '''.stage.is-animating .page-card {
    transition:
        transform var(--page-turn-duration) var(--ease-page-turn),
        box-shadow var(--page-turn-duration) var(--ease-page-turn);
}'''
          new_transition = '''.stage.is-animating .page-card {
    transition:
        transform var(--page-turn-duration) var(--ease-page-turn),
        filter var(--page-turn-duration) var(--ease-page-turn);
}'''

          if old_transition not in css:
              raise RuntimeError('page-turn transition block not found')
          css = css.replace(old_transition, new_transition, 1)

          old_current = '''.app.normal .stage:not(.turn-prev) .page-card--current {
    z-index: 4;
    opacity: 1;
    transform: translateX(var(--drag-x));
    box-shadow: var(--turn-shadow);
}'''
          new_current = '''.app.normal .stage:not(.turn-prev) .page-card--current {
    z-index: 4;
    opacity: 1;
    transform: translateX(var(--drag-x));
    filter: drop-shadow(
        12px 0 12px
        rgba(0, 0, 0, calc(var(--turn-shadow-opacity) * .42))
    );
}'''

          if old_current not in css:
              raise RuntimeError('forward page-turn block not found')
          css = css.replace(old_current, new_current, 1)

          old_prev = '''.app.normal .stage.turn-prev .page-card--prev {
    z-index: 5;
    opacity: 1;
    pointer-events: none;
    transform: translateX(var(--return-x));
    box-shadow: var(--turn-shadow);
}'''
          new_prev = '''.app.normal .stage.turn-prev .page-card--prev {
    z-index: 5;
    opacity: 1;
    pointer-events: none;
    transform: translateX(var(--return-x));
    filter: drop-shadow(
        12px 0 12px
        rgba(0, 0, 0, calc(var(--turn-shadow-opacity) * .42))
    );
}'''

          if old_prev not in css:
              raise RuntimeError('backward page-turn block not found')
          css = css.replace(old_prev, new_prev, 1)

          path.write_text(css, encoding='utf-8')
          PY

          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'zz copy/shared/style.css'
          git commit -m 'Restore visible page turn shadow'
          git push

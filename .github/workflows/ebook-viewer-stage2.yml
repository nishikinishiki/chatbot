name: Ebook viewer stage 2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ebook-viewer-stage2.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stage 2 implementation
        run: python .github/scripts/ebook_viewer_stage2.py

      - name: Validate syntax and scope
        shell: bash
        run: |
          node --check zz_ebook/shared/viewer.js
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'zz_ebook/shared/style.css\nzz_ebook/shared/viewer.js'
          ! grep -q 'case "note"' zz_ebook/shared/viewer.js
          ! grep -q 'function paginateNote' zz_ebook/shared/viewer.js
          ! grep -q '\[!NOTE\]' zz_ebook/shared/viewer.js
          grep -q 'case "h3"' zz_ebook/shared/viewer.js
          grep -q 'case "footnotes"' zz_ebook/shared/viewer.js
          grep -q 'line === "{.no-indent}"' zz_ebook/shared/viewer.js
          grep -q 'text.startsWith("<small>", index)' zz_ebook/shared/viewer.js
          grep -q 'text.startsWith("\*\*", index)' zz_ebook/shared/viewer.js
          grep -q 'element?.matches("h1, h2, h3")' zz_ebook/shared/viewer.js
          ! grep -q '\.book-note' zz_ebook/shared/style.css
          grep -q 'p.no-indent' zz_ebook/shared/style.css

      - name: Smoke-test Markdown model
        shell: bash
        run: |
          cat > /tmp/test-stage2.js <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          let source = fs.readFileSync('zz_ebook/shared/viewer.js', 'utf8');
          source = source.replace(
            '    if (!window.bookMarkdown) {',
            '    globalThis.__parseBookMarkdown = parseBookMarkdown;\n    return;\n\n    if (!window.bookMarkdown) {'
          );

          const context = {
            console,
            document: { documentElement: {} },
            getComputedStyle() {
              return { getPropertyValue() { return ''; } };
            }
          };
          vm.runInNewContext(source, context);
          const parse = context.__parseBookMarkdown;
          assert.equal(typeof parse, 'function');

          const md = `---
          title: Test
          cover: cover.jpg
          published: 2026
          ---
          # Chapter One
          Intro[^※1]

          [^※1]: Intro note

          ## Section A
          ### Subheading
          {.no-indent}
          This is **bold** and <small>small</small>.[^※2]

          ## Section B
          Same ref again.[^※2]

          [^※2]: Section note

          # Chapter Two
          Reused ref.[^※2]
          `;

          const book = parse(md);
          assert.equal(book.chapters.length, 2);
          const first = book.chapters[0];
          const second = book.chapters[1];

          assert(first.blocks.some((b) => b.type === 'h3'));
          assert(!first.blocks.some((b) => b.type === 'note'));

          const noIndent = first.blocks.find((b) => b.type === 'paragraph' && b.noIndent);
          assert(noIndent, 'no-indent paragraph missing');
          assert(noIndent.inline.some((s) => s.type === 'text' && s.marks.includes('strong')));
          assert(noIndent.inline.some((s) => s.type === 'text' && s.marks.includes('small')));
          assert(noIndent.inline.some((s) => s.type === 'footnote-ref' && s.label === '※2'));

          const firstH2 = first.blocks.findIndex((b) => b.type === 'h2');
          const introFootnotes = first.blocks.findIndex((b) => b.type === 'footnotes');
          assert(introFootnotes !== -1 && introFootnotes < firstH2, 'H1-scope footnote not before first H2');

          const h2Indexes = first.blocks
            .map((b, i) => b.type === 'h2' ? i : -1)
            .filter((i) => i >= 0);
          const sectionFootnotes = first.blocks.findIndex(
            (b, i) => b.type === 'footnotes' && i > h2Indexes[0]
          );
          assert(sectionFootnotes > h2Indexes[0] && sectionFootnotes < h2Indexes[1], 'H2-scope footnote not at Section A end');

          const allFootnoteItems = [...first.blocks, ...second.blocks]
            .filter((b) => b.type === 'footnotes')
            .flatMap((b) => b.items.map((item) => item.label));
          assert.equal(allFootnoteItems.join(','), '※1,※2');

          const sectionB = first.blocks.slice(h2Indexes[1]);
          const reusedRef = sectionB.some((b) =>
            b.inline?.some((s) => s.type === 'footnote-ref' && s.label === '※2')
          );
          assert(reusedRef, 'reused reference should still render');
          assert(!second.blocks.some((b) => b.type === 'footnotes'), 'reused footnote must not be repeated in another chapter');

          console.log('stage2 parser smoke test passed');
          NODE
          node /tmp/test-stage2.js

      - name: Commit stage 2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zz_ebook/shared/viewer.js zz_ebook/shared/style.css
          git commit -m "Add structured Markdown formatting and scoped footnotes"
          git push origin main

name: Update ebook footnote labels

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-ebook-footnote-labels.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch footnote labels
        run: python .github/scripts/update_ebook_footnote_labels.py

      - name: Validate changes
        shell: bash
        run: |
          node --check zz_ebook/shared/viewer.js
          git diff --check
          grep -q 'getFootnoteReferenceLabel' zz_ebook/shared/viewer.js
          grep -q 'reference.textContent = label' zz_ebook/shared/viewer.js
          grep -q 'list-style: none' zz_ebook/shared/style.css
          if git diff --name-only | grep -q '/data.js$'; then
            echo "data.js must not be changed"
            exit 1
          fi

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zz_ebook/shared/viewer.js zz_ebook/shared/style.css
          git commit -m "Use Markdown footnote IDs as display labels"
          git push origin main

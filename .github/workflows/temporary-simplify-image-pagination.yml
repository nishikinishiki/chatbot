name: Temporary simplify ebook image pagination

on:
  push:
    paths:
      - .github/workflows/temporary-simplify-image-pagination.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Simplify image pagination
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('zz_ebook/shared/viewer.js')
          text = path.read_text(encoding='utf-8')

          old = '''    function paginateImageBlock(block, chapterIndex) {\n        const node = createImageBlock(block);\n        els.measureBody.appendChild(node);\n\n        if (fitsMeasureBody()) return;\n        if (fitImageBlockToCurrentPage(node)) return;\n\n        moveBlockToNewPage(node, chapterIndex);\n\n        if (!fitsMeasureBody() && !fitImageBlockToCurrentPage(node, 0)) {\n            throw new Error(\n                `Image block cannot fit on an empty page: ${block.src}`\n            );\n        }\n    }\n'''

          new = '''    function paginateImageBlock(block, chapterIndex) {\n        const node = createImageBlock(block);\n        els.measureBody.appendChild(node);\n\n        if (fitsMeasureBody()) return;\n        if (fitImageBlockToCurrentPage(node)) return;\n\n        moveBlockToNewPage(node, chapterIndex);\n    }\n'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'paginateImageBlock match count: {count}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check zz_ebook/shared/viewer.js
          grep -q 'moveBlockToNewPage(node, chapterIndex);' zz_ebook/shared/viewer.js
          ! grep -q 'Image block cannot fit on an empty page' zz_ebook/shared/viewer.js
          ! grep -q 'fitImageBlockToCurrentPage(node, 0)' zz_ebook/shared/viewer.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zz_ebook/shared/viewer.js
          git commit -m "Simplify image pagination fallback"
          git push

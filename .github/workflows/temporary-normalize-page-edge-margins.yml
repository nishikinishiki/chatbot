name: Temporary normalize ebook page edge margins

on:
  push:
    paths:
      - .github/workflows/temporary-normalize-page-edge-margins.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize page edge margins
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('zz_ebook/shared/style.css')
          css = path.read_text(encoding='utf-8')

          old_paragraph_rule = ''':where(.page-body, .measure-body) p:last-child {\n    margin-bottom: 0;\n}\n\n'''
          if css.count(old_paragraph_rule) != 1:
              raise SystemExit(f'paragraph last-child rule count: {css.count(old_paragraph_rule)}')
          css = css.replace(old_paragraph_rule, '', 1)

          first_rule = ''':where(.page-body, .measure-body) > :first-child {\n    margin-top: 0;\n}\n'''
          if css.count(first_rule) != 1:
              raise SystemExit(f'first-child rule count: {css.count(first_rule)}')

          edge_rules = first_rule + '''\n:where(.page-body, .measure-body) > :last-child {\n    margin-bottom: 0;\n}\n'''
          css = css.replace(first_rule, edge_rules, 1)

          path.write_text(css, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check zz_ebook/shared/viewer.js
          ! grep -q ':where(.page-body, .measure-body) p:last-child' zz_ebook/shared/style.css
          grep -A6 '^:where(.page-body, .measure-body) > :first-child' zz_ebook/shared/style.css | grep -q '> :last-child'

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zz_ebook/shared/style.css
          git commit -m "Normalize ebook page edge margins"
          git push

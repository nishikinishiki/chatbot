<!DOCTYPE html>
<html lang="ja">

<head>


    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>お問い合わせ｜マンション投資のJPリターンズ株式会社</title>
    <meta name="description" content="初めてでも安心！年収600万円からのマンション投資。J.P.RETURNSのマンション投資で叶える堅実な家賃収入。あなたに寄り添うコンサルティングをご提供します。">
    <link rel="stylesheet" href="/common/css/style.css" id="main-stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="/ebook_test/js/config.js"></script>
    <script>
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            const utmSource = urlParams.get('utm_source');

            let styleUrl = STYLE_DEFAULT;

            if (utmSource && typeof STYLE_CAMPAIGN !== 'undefined') {
                for (const key in STYLE_CAMPAIGN) {
                    if (utmSource.includes(key)) {
                        styleUrl = STYLE_CAMPAIGN[key];
                        break;
                    }
                }
            }

            if (styleUrl !== STYLE_DEFAULT) {
                document.getElementById('main-stylesheet').href = styleUrl;
            }
        })();
    </script>
</head>

<body>


    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-header-title">J.P.RETURNS テスト専用</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
        </div>
    </div>

    <div class="modal-overlay" id="giftTermsModal">
        <div class="modal-content">
            <button class="modal-close-button" id="modalCloseButton">&times;</button>
            <h3 id="modalTitle"></h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- 順番が重要です: config -> questions -> ui -> lead-analytics -> main -->
    <script src="/ebook_test/js/questions.js"></script>
    <script src="/ebook_test/js/ui.js"></script>
    <script src="/ebook_test/js/pardot-config.js"></script>
    <script src="/ebook_test/js/pardot.js"></script>
    <script src="/ebook_test/js/tracking.js"></script>
    <script src="/ebook_test/js/main.js"></script>

</body>

</html>
